name: flake-update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16
      - uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9

      - name: nix flake update
        run: nix flake update

      - name: Verify both hosts still build
        run: |
          nix build .#darwinConfigurations.shaikmdirfannawaz.system --show-trace
          nix build .#darwinConfigurations.irfan-personal.system --show-trace

      - name: treefmt --check
        # CONTRIBUTING.md requires `nix fmt` clean before a PR. A flake
        # input bump can change treefmt's pinned nixfmt/statix/deadnix,
        # which would surface as a CI failure on the auto-bump PR otherwise.
        run: nix build .#checks.aarch64-darwin.formatting --show-trace

      - name: Open PR with flake.lock bump
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: weekly flake.lock bump"
          title: "chore: weekly flake.lock bump"
          body: |
            Automated weekly `nix flake update`.

            Both `darwinConfigurations` were verified to build against the new
            lock file before this PR was opened.
          branch: chore/flake-update
          delete-branch: true
