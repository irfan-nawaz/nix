name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  flake-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9

      - name: Nix flake check
        # Builds checks.<system>.{shaikmdirfannawaz,irfan-personal} which
        # are the host darwin-system derivations, plus the formatting
        # check — no need for additional explicit `nix build` steps.
        run: nix flake check --show-trace

  format-check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@6221693898146dc97e38ad0e013488a16477a4c4 # v9
      - name: treefmt --check
        run: nix build .#checks.aarch64-darwin.formatting --show-trace

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # Run gitleaks via nixpkgs to share the version pinned in
      # modules/packages/security.nix instead of taking on the
      # gitleaks-action license/maintenance burden. `detect` scans the full
      # git history (made available by fetch-depth: 0 above).
      - name: gitleaks detect
        run: nix shell nixpkgs#gitleaks -c gitleaks detect --source . --redact --verbose
